# Firebase App Hosting settings: https://firebase.google.com/docs/app-hosting/configure
runConfig:
  minInstances: 0
  maxInstances: 2

env:
  # Your Firebase web config is provided automatically by App Hosting.

  # Google accounts allowed into the admin panel (comma-separated)
  - variable: ADMIN_EMAILS
    value: shuey@chabadcuritiba.com, tzivis@gmail.com
    availability:
      - RUNTIME

  # Asaas payments (Pix, boleto, card). The site picks production or sandbox
  # from the API key itself; this is only a fallback for older keys.
  - variable: ASAAS_ENV
    value: sandbox
    availability:
      - RUNTIME
  # Create the secrets first with:
  #   npx firebase apphosting:secrets:set asaas-api-key
  #   npx firebase apphosting:secrets:set asaas-webhook-token
  # then uncomment:
  # - variable: ASAAS_API_KEY
  #   secret: asaas-api-key
  #   availability:
  #     - RUNTIME
  # - variable: ASAAS_WEBHOOK_TOKEN
  #   secret: asaas-webhook-token
  #   availability:
  #     - RUNTIME
