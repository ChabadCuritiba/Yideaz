# Firebase App Hosting settings: https://firebase.google.com/docs/app-hosting/configure
runConfig:
  minInstances: 0
  maxInstances: 2

env:
  # Firebase web app config (Project settings > Your apps > Web app). Not secret.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: REPLACE_ME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: REPLACE_ME.firebaseapp.com
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: REPLACE_ME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: REPLACE_ME.firebasestorage.app
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: REPLACE_ME

  # Google accounts allowed into the admin panel (comma-separated)
  - variable: ADMIN_EMAILS
    value: you@example.com
    availability:
      - RUNTIME

  - variable: SITE_URL
    value: https://REPLACE_ME.hosted.app

  # Asaas payments (Pix, boleto, card). Use "sandbox" while testing.
  - variable: ASAAS_ENV
    value: sandbox
    availability:
      - RUNTIME
  # Create the secrets first with:
  #   npx firebase apphosting:secrets:set asaas-api-key
  #   npx firebase apphosting:secrets:set asaas-webhook-token
  # then uncomment:
  # - variable: ASAAS_API_KEY
  #   secret: asaas-api-key
  #   availability:
  #     - RUNTIME
  # - variable: ASAAS_WEBHOOK_TOKEN
  #   secret: asaas-webhook-token
  #   availability:
  #     - RUNTIME
